name: Create new Release

on:
  workflow_dispatch:
    inputs:
      versionIncrement:
        description: 'Which part of the version to increment'
        type: choice
        options:
          - Patch
          - Minor
          - Major
        default: Patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Calculate version
      id: version
      env:
        INCREMENT: ${{ inputs.versionIncrement }}
      run: |
        IFS=. read -r major minor patch <<< "$(git describe --tags --abbrev=0 --match 'v[0-9]*' | sed 's/^v//')"
        patch=${patch%%-*}
        case "$INCREMENT" in
          Major) major=$((major + 1)); minor=0; patch=0 ;;
          Minor) minor=$((minor + 1)); patch=0 ;;
          Patch) patch=$((patch + 1)) ;;
        esac
        echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

    - name: Get changelog entries
      id: changelog
      uses: mindsers/changelog-reader-action@v2.4.0
      with:
        version: Unreleased
        path: ./CHANGELOG.md

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 10.0.x

    # Pack before tagging so a failing build doesn't leave a release without a package.
    - name: Create release package
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: dotnet pack -c Release -p:PackageVersion="$VERSION" -p:PackageOutputPath="$GITHUB_WORKSPACE/packages" -p:ContinuousIntegrationBuild=true --nologo

    - name: Update CHANGELOG file
      uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
      with:
        version: ${{ steps.version.outputs.version }}

    - name: Commit and push CHANGELOG
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config --local user.email "linkdotnet@action.com"
        git config --local user.name "LinkDotNet Bot"
        git add CHANGELOG.md
        git commit -m "Update Changelog.md for $VERSION release"
        git push origin main

    - name: Create release on GitHub
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
        NOTES: ${{ steps.changelog.outputs.changes }}
      run: gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes "$NOTES"

    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Upload to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "$GITHUB_WORKSPACE/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
